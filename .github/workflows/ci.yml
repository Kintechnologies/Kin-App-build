name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new push lands — no value in
# letting a stale run finish once a newer commit is already being checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (next)
        working-directory: apps/web
        run: npx next lint

      - name: Type check (web)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Type check (shared)
        working-directory: packages/shared
        run: npx tsc --noEmit

      - name: Test (shared)
        run: npm run test -w @kin/shared

      - name: Test (web)
        run: npm run test -w @kin/web

      - name: Build (web)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          NEXT_PUBLIC_APP_URL: https://kinai.family
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
        run: npx next build
