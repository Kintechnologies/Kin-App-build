# Edge Functions Configuration
[functions.morning-briefing]
verify_jwt = false

# Delivery-audit backstop, triggered by the pg_cron job in
# 047_briefing_audit_cron.sql. verify_jwt = false so the cron POST needs no
# Authorization header.
[functions.briefing-audit]
verify_jwt = false

# Proxies the sub-daily cron jobs (pickup-risk, sunday-checkin,
# engagement-nudges onboarding) to their Vercel-hosted Next.js routes. Moved
# off Vercel Cron because the Hobby plan only allows daily schedules; the
# pg_cron jobs live in 058_subdaily_crons.sql. verify_jwt = false so the
# pg_cron POST needs no Authorization header — the function authenticates to
# the Next.js routes with the auto-injected SUPABASE_SERVICE_ROLE_KEY.
[functions.cron-dispatch]
verify_jwt = false

[auth]
enable_signup = true

[auth.external.google]
enabled = false

# Phone OTP is the primary auth method. OTPs are delivered via Twilio Verify,
# which uses its own Twilio-managed sender pool — deliberately separate from
# the Messaging Service that sends morning briefings. This keeps STOP opt-outs
# isolated: texting STOP to an OTP code won't also disable a user's briefings.
# Production values live in the Supabase dashboard (Authentication > Providers
# > Phone); the env() refs below only apply to local `supabase start`.
[auth.sms]
enable_signup = true
enable_confirmations = true

[auth.sms.twilio_verify]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
# Twilio Verify Service SID (starts with VA...) — not a Messaging Service SID.
message_service_sid = "env(TWILIO_VERIFY_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"
